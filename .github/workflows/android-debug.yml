name: MCP Control — Fresh APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "core/**"
      - "tests/**"
      - "runtime/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PYTHONPATH: ${{ github.workspace }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Security regression tests
        run: python -m unittest discover -s ../tests -p 'test_*.py'

      - name: Clean build
        run: gradle --no-daemon clean

      - name: Build debug APK
        run: gradle --no-daemon --refresh-dependencies :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mcp-control-apk-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
# Rebuild trigger: validate the current Android UI/monitor sources.
# Fresh APK requested after security mapping test fix.
