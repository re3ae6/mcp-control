name: MCP Control — Fresh APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install launcher icons
        run: |
          rm -rf ../.icon_install_tmp
          mkdir -p ../.icon_install_tmp
          unzip -q ../MCP_CONTROL_Android_Icons.zip -d ../.icon_install_tmp
          for density in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            src="$(find ../.icon_install_tmp -type d -name "mipmap-$density" -print -quit)"
            if [ -n "$src" ]; then
              mkdir -p "app/src/main/res/mipmap-$density"
              cp -f "$src"/* "app/src/main/res/mipmap-$density"/
            fi
          done
          rm -rf ../.icon_install_tmp
          test -f app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-mdpi/ic_launcher_round.png

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Clean build
        run: gradle --no-daemon clean

      - name: Build debug APK
        run: gradle --no-daemon --refresh-dependencies :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mcp-control-apk-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
