plugins { id 'com.android.application' }

android {
    namespace 'com.re3ae6.mcpcontrol'
    compileSdk 35
    defaultConfig {
        applicationId 'com.re3ae6.mcpcontrol'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '0.2.3'
        buildConfigField "String", "GIT_COMMIT", "\"" + (System.getenv("GITHUB_SHA") ?: "dev") + "\""
    }
    buildFeatures {
        buildConfig true
    }
}
